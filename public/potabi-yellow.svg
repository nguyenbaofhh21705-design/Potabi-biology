<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <radialGradient id="potabiYellowGrad" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#FFF380" />
      <stop offset="70%" stop-color="#FCE358" />
      <stop offset="100%" stop-color="#F2CE3A" />
    </radialGradient>
    <linearGradient id="crownGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE84D" />
      <stop offset="100%" stop-color="#F5B82E" />
    </linearGradient>
  </defs>

  <!-- Subtle Ground Shadow -->
  <ellipse cx="120" cy="218" rx="46" ry="8" fill="#31101e" opacity="0.16" />

  <!-- Left Leg (Orange-brown stick leg with flat oval foot) -->
  <g stroke="#231F20" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 94 184 L 91 210 L 97 210 L 100 185 Z" fill="#F09436" />
    <ellipse cx="92" cy="212" rx="11" ry="4" fill="#F09436" />
  </g>

  <!-- Right Leg (Orange-brown stick leg with flat oval foot) -->
  <g stroke="#231F20" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 140 185 L 142 210 L 148 210 L 146 184 Z" fill="#F09436" />
    <ellipse cx="147" cy="212" rx="11" ry="4" fill="#F09436" />
  </g>

  <!-- Crown on top of head (tilted slightly like the hand-drawn sketch) -->
  <path
    d="M 103 62 L 96 34 L 111 43 L 121 31 L 130 43 L 144 34 L 138 62 Z"
    fill="url(#crownGrad)"
    stroke="#231F20"
    stroke-width="3.6"
    stroke-linejoin="round"
  />

  <!-- Round Yellow Body -->
  <circle
    cx="120"
    cy="124"
    r="68"
    fill="url(#potabiYellowGrad)"
    stroke="#231F20"
    stroke-width="3.8"
  />

  <!-- Soft Colored-Pencil Texture Arcs -->
  <path
    d="M 70 100 A 56 56 0 0 1 165 92"
    fill="none"
    stroke="#FFF9B0"
    stroke-width="3"
    stroke-linecap="round"
    opacity="0.6"
  />
  <path
    d="M 72 152 A 58 58 0 0 0 168 150"
    fill="none"
    stroke="#E8BE2A"
    stroke-width="3.5"
    stroke-linecap="round"
    opacity="0.45"
  />

  <!-- Cute Pink Rosy Cheeks -->
  <ellipse cx="83" cy="112" rx="8.5" ry="5.2" fill="#F7A1A8" opacity="0.88" />
  <ellipse cx="157" cy="111" rx="8.5" ry="5.2" fill="#F7A1A8" opacity="0.88" />

  <!-- Eyes (Solid black dots) -->
  <circle cx="93" cy="102" r="3.6" fill="#231F20" />
  <circle cx="146" cy="102" r="3.6" fill="#231F20" />

  <!-- Happy Open Mouth with Pink Tongue -->
  <path
    d="M 111 97 Q 120 103 128 97"
    fill="none"
    stroke="#231F20"
    stroke-width="3.2"
    stroke-linecap="round"
  />
  <path
    d="M 114 99 C 114 111, 125 111, 125 99 Z"
    fill="#F49AA2"
    stroke="#231F20"
    stroke-width="3"
    stroke-linejoin="round"
  />

  <!-- Left Little Stick Arm resting on belly with 3 fingers -->
  <g stroke="#231F20" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 69 123 L 82 142 L 85 139 L 73 120 Z" fill="#F09436" />
    <line x1="82" y1="141" x2="89" y2="138" />
    <line x1="82" y1="141" x2="88" y2="144" />
    <line x1="82" y1="141" x2="80" y2="148" />
  </g>

  <!-- Right Little Stick Arm resting on belly with 3 fingers -->
  <g stroke="#231F20" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 171 122 L 156 141 L 153 138 L 167 119 Z" fill="#F09436" />
    <line x1="156" y1="140" x2="149" y2="137" />
    <line x1="156" y1="140" x2="150" y2="143" />
    <line x1="156" y1="140" x2="157" y2="147" />
  </g>
</svg>
