<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <radialGradient id="potabiBlueGrad" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#B8E4FF" />
      <stop offset="70%" stop-color="#8FD0F7" />
      <stop offset="100%" stop-color="#6FBCEB" />
    </radialGradient>
    <linearGradient id="crownBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE84D" />
      <stop offset="100%" stop-color="#F5B82E" />
    </linearGradient>
  </defs>

  <!-- Subtle Ground Shadow -->
  <ellipse cx="120" cy="222" rx="46" ry="7" fill="#31101e" opacity="0.16" />

  <!-- Raised Left Stick Arm with 3 fingers -->
  <g stroke="#231F20" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 65 98 L 47 56 L 52 54 L 70 95 Z" fill="#F09436" />
    <line x1="48" y1="55" x2="41" y2="49" />
    <line x1="49" y1="54" x2="48" y2="45" />
    <line x1="51" y1="55" x2="55" y2="47" />
  </g>

  <!-- Raised Right Stick Arm with 3 fingers -->
  <g stroke="#231F20" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 173 98 L 191 58 L 186 55 L 168 95 Z" fill="#F09436" />
    <line x1="189" y1="56" x2="184" y2="48" />
    <line x1="190" y1="56" x2="192" y2="47" />
    <line x1="191" y1="57" x2="198" y2="52" />
  </g>

  <!-- Long Left Stick Leg with 3-toed foot -->
  <g stroke="#231F20" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 97 175 L 88 214 L 94 215 L 103 176 Z" fill="#F09436" />
    <line x1="90" y1="214" x2="80" y2="218" />
    <line x1="91" y1="214" x2="89" y2="223" />
    <line x1="93" y1="214" x2="98" y2="221" />
  </g>

  <!-- Long Right Stick Leg with 3-toed foot -->
  <g stroke="#231F20" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 137 176 L 149 214 L 155 213 L 143 175 Z" fill="#F09436" />
    <line x1="151" y1="213" x2="145" y2="221" />
    <line x1="152" y1="213" x2="154" y2="223" />
    <line x1="154" y1="213" x2="163" y2="218" />
  </g>

  <!-- Crown on Top -->
  <path
    d="M 103 55 L 97 28 L 111 37 L 120 25 L 130 37 L 143 29 L 137 55 Z"
    fill="url(#crownBlueGrad)"
    stroke="#231F20"
    stroke-width="3.6"
    stroke-linejoin="round"
  />

  <!-- Round Light-Blue Body -->
  <circle
    cx="120"
    cy="116"
    r="65"
    fill="url(#potabiBlueGrad)"
    stroke="#231F20"
    stroke-width="3.8"
  />

  <!-- Pink Rosy Cheeks -->
  <ellipse cx="76" cy="105" rx="8" ry="5" fill="#F7A1A8" opacity="0.88" />
  <ellipse cx="164" cy="103" rx="8" ry="5" fill="#F7A1A8" opacity="0.88" />

  <!-- Eyes -->
  <circle cx="90" cy="91" r="3.5" fill="#231F20" />
  <circle cx="151" cy="90" r="3.5" fill="#231F20" />

  <!-- Big Expressive Pink Bean Mouth with Single White Tooth -->
  <path
    d="M 92 108 C 92 96, 112 96, 120 103 C 128 96, 148 96, 148 108 C 151 122, 132 126, 120 121 C 108 126, 89 122, 92 108 Z"
    fill="#F49AA2"
    stroke="#231F20"
    stroke-width="3.2"
    stroke-linejoin="round"
  />
  <!-- Single Center Tooth -->
  <rect
    x="114"
    y="102"
    width="12"
    height="10"
    rx="2"
    fill="#FFFFFF"
    stroke="#231F20"
    stroke-width="2.8"
  />
</svg>
